# Minimal Kubernetes manifests for the API (not applied or tested in this repo). Adjust image, secrets and domain.
apiVersion: apps/v1
kind: Deployment
metadata: { name: dictionary-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: dictionary-api } }
  template:
    metadata: { labels: { app: dictionary-api } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: api
          image: ghcr.io/nikhil-creat/dictionary-api:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: dictionary-secrets } }]   # GROQ_API_KEY, GEMINI_API_KEY, API_KEYS, DATABASE_URL ...
          readinessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, periodSeconds: 20 }
          resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: "1", memory: 512Mi } }
          securityContext: { readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: dictionary-api }
spec:
  selector: { app: dictionary-api }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: dictionary-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: dictionary-api }
  minReplicas: 2
  maxReplicas: 10
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
